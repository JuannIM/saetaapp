name: Build Android APK

on:
  push:
    branches: [ "main", "feature/*" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Unit Tests
        run: |
          cd android
          gradle test --stacktrace

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAETASaldo-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: SAETA Saldo Android ${{ github.ref_name }}
          body: |
            ### SAETA Saldo para Android
            - APK de depuración lista para instalar en cualquier dispositivo Android.
            - Incluye lectura NFC nativa, OCR local on-device con ML Kit y Widget de escritorio.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
